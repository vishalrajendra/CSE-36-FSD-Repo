<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
    <h2>Login Form</h2>
    <form action="submit.html" onsubmit="return check()">

    <label for="userid">Username</label>
    <input type="text" id="userid" placeholder="Enter Username"><br><br>

    <label for="passwd">Password</label>
    <input type="password" id="passwd" placeholder="Enter Password"><br><br>

    <label for="confirmPass">Confirm Password</label>
    <input type="password" id="confirmPass" placeholder="Confirm Password"><br><br>

    <input type="submit" value="Submit">

</form>
        
 

    <script src="script.js"></script>

</body>
</html>
